[project]
name = "kev-soporte-resto"
version = "0.1.0"
description = "Soporte de restaurante atendido por Kev, un modelo de decisión open source que corre local: área, urgencia, enojo y escalado en una sola pasada."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
record = ["playwright>=1.47"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
